<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tetris-bot embed</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #bot {
        --bot-bg: oklch(0.16 0 0);
        --bot-grid: oklch(0.31 0 0);
        --bot-cell: oklch(0.71 0 0);
        --bot-cell-active: oklch(0.94 0 0);
        --bot-cell-ghost: oklch(0.38 0 0);
        --bot-text: oklch(0.9 0 0);
        --bot-text-dim: oklch(0.58 0 0);
        --bot-accent: oklch(0.79 0.17 84);
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="bot"></canvas>
    <script type="module" src="./embed.ts"></script>
  </body>
</html>
